name: Publish DocC documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and prepare DocC archive
        env:
          DERIVED_DATA: ${{ runner.temp }}/WeatherlyDerivedData
          SITE_DIR: ${{ runner.temp }}/WeatherlySite
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          xcodebuild docbuild \
            -project Weatherly.xcodeproj \
            -scheme Weatherly \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

          ARCHIVE_PATH="$(find "$DERIVED_DATA/Build/Products" \
            -type d -name 'Weatherly.doccarchive' -print -quit)"

          if [ -z "$ARCHIVE_PATH" ]; then
            echo "Weatherly.doccarchive was not found"
            exit 1
          fi

          xcrun docc process-archive transform-for-static-hosting \
            "$ARCHIVE_PATH" \
            --output-path "$SITE_DIR" \
            --hosting-base-path "$DOCS_BASE_PATH"

          cat > "$SITE_DIR/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=${DOCS_BASE_PATH}/documentation/weatherly">
            <title>Weatherly documentation</title>
          </head>
          <body>
            <p><a href="${DOCS_BASE_PATH}/documentation/weatherly">Open Weatherly documentation</a></p>
            <script>window.location.replace("${DOCS_BASE_PATH}/documentation/weatherly");</script>
          </body>
          </html>
          EOF

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/WeatherlySite

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
