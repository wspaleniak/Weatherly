name: Publish DocC documentation

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and prepare DocC archive
        env:
          DERIVED_DATA: ${{ runner.temp }}/WeatherlyDerivedData
          SITE_DIR: ${{ runner.temp }}/WeatherlySite
        run: |
          xcodebuild docbuild \
            -project Weatherly.xcodeproj \
            -scheme Weatherly \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

          ARCHIVE_PATH="$(find "$DERIVED_DATA/Build/Products" \
            -type d -name 'Weatherly.doccarchive' -print -quit)"

          if [ -z "$ARCHIVE_PATH" ]; then
            echo "Weatherly.doccarchive was not found"
            exit 1
          fi

          xcrun docc process-archive transform-for-static-hosting \
            "$ARCHIVE_PATH" \
            --output-path "$SITE_DIR" \
            --hosting-base-path /Weatherly

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/WeatherlySite

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
